[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fly-connectome"
version = "0.1.0"
description = "Local-plasticity spiking experiments on measured MaleCNS topology"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "torch>=2.5"]

[project.optional-dependencies]
data = ["pyarrow>=17", "scipy>=1.11"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fly_connectome.ui" = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
