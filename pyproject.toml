[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fly-connectome"
version = "0.1.0"
description = "Local-plasticity spiking experiments on measured MaleCNS topology"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "torch>=2.5"]

[project.optional-dependencies]
data = ["pyarrow>=17", "scipy>=1.11"]
test = ["pytest>=8"]
table-tennis = ["mujoco==3.17.0", "scipy>=1.11", "Pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fly_connectome" = ["native_cpu.cpp"]
"fly_connectome.ui" = ["*.html", "*.css", "*.js"]
"fly_connectome.viewer" = ["*.html", "*.css", "*.js"]
"fly_connectome.vision" = ["data/default.pt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
